name: PHP compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - "7.4"
          - "8.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . \
            -type f \
            -name '*.php' \
            -not -path './vendor/*' \
            -print0 |
          xargs -0 -n1 php -l

  php-compatibility:
    name: PHPCompatibilityWP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify installed standards
        run: vendor/bin/phpcs -i

      - name: Check PHP compatibility
        run: composer compat
